formatter: markdown table

version: ">= 0.16"

header-from: README.md
footer-from: ""

recursive:
  enabled: false

sections:
  hide-all: false
  show-all: true

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  indent: 2
  required: true
  sensitive: true
  type: true
